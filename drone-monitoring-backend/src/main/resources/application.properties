spring.datasource.url=jdbc:postgresql://localhost:5432/Drone_monitoring
spring.datasource.username=postgres
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
telemetry.mode=SIMULATOR

logging.level.com.aditya.dronemonitoring=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger - %msg%n

jwt.secret=MySuperSecretDroneMonitoringKeyThatIsAtLeast32CharactersLong12345
jwt.expiration=3600000

server.port=8081