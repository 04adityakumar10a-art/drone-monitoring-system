# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# ERROR HANDLING
# ==========================================

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never


# ==========================================
# TELEMETRY
# ==========================================

telemetry.mode=SIMULATOR


# ==========================================
# LOGGING
# ==========================================

logging.level.com.aditya.dronemonitoring=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger - %msg%n


# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}


# ==========================================
# SERVER
# ==========================================

server.port=8081